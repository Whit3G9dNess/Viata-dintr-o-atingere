  /* Ocupăm tot ecranul, fără margini și fără bare de derulare */
  html, body {

    overflow: hidden;

    cursor: none;          /* ascundem cursorul de sistem — desenăm noi unul luminos */

  }
  canvas { display: block; }
</style>
</head>
