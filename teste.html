<style>

<h1>Viața dintr-o atingere — teste</h1>
<div id="rezumat">se încarcă…</div>
<div id="lista"></div>
<script>
"use strict";

/* ==========================================================================
   1. MINI-CADRU DE TESTE
   ========================================================================== */

const lista = document.getElementById("lista");
let trecute = 0, cazute = 0;

function sectiune(titlu) {
  const h = document.createElement("h2");
  h.textContent = titlu;
  lista.appendChild(h);
}

/* Cât a ținut fiecare test. Nu e o statistică de dragul ei: suita a ajuns la
   două sute și ceva de teste, iar când una dintre săli începe să deseneză mai mult
   decât trebuie, se vede întâi aici — rularea trece de la douăzeci de secunde la
   două minute și nu se știe din ce. Cinci nume la sfârșit ajung ca să se știe. */
const durate = [];

function test(nume, corp) {
  const rand = document.createElement("div");
  rand.className = "test";
  const plecat = performance.now();
  try {
    corp();
    durate.push({ nume, ms: performance.now() - plecat });
    trecute++;
    rand.classList.add("trecut");
    rand.textContent = "✅ " + nume;
    lista.appendChild(rand);
  } catch (e) {
    durate.push({ nume, ms: performance.now() - plecat });
    cazute++;
    rand.classList.add("cazut");
    rand.textContent = "❌ " + nume;
    lista.appendChild(rand);
    const motiv = document.createElement("div");
    motiv.className = "motiv";
    motiv.textContent = e && e.message ? e.message : String(e);
    lista.appendChild(motiv);
  }
}

function cade(mesaj) { throw new Error(mesaj); }

function adevarat(conditie, mesaj) {
  if (!conditie) cade(mesaj || "așteptam adevărat");
}

function egal(gasit, asteptat, mesaj) {
  if (gasit !== asteptat) {
    cade((mesaj ? mesaj + " — " : "") + "așteptam " + JSON.stringify(asteptat) +
         ", am găsit " + JSON.stringify(gasit));
  }
}

function aproape(gasit, asteptat, toleranta, mesaj) {
  const tol = toleranta === undefined ? 1e-6 : toleranta;
  if (!(Math.abs(gasit - asteptat) <= tol)) {
    cade((mesaj ? mesaj + " — " : "") + "așteptam ~" + asteptat + " (±" + tol +
         "), am găsit " + gasit);
  }
}

/* ==========================================================================
   2. ALEATOR CONTROLAT ȘI CEAS CONTROLAT
   ========================================================================== */

/* Scena cheamă Math.random în multe locuri, iar timpul îl ia din
   performance.now(). Le înlocuim pe amândouă, ca testele să fie repetabile
   și ca o secundă de poveste să nu însemne o secundă de așteptare. */

let samanta = 1;
Math.random = function () {
  samanta = (samanta * 1103515245 + 12345) % 2147483648;
  return samanta / 2147483648;
};
function reseteazaAleatorul(s) { samanta = s || 1; }

/* ==========================================================================
   3. PÂNZA FALSĂ — ÎNREGISTREAZĂ DESENUL ÎN LOC SĂ-L AFIȘEZE
   ========================================================================== */

function inmulteste(A, B) {
  return [
    A[0] * B[0] + A[2] * B[1],
    A[1] * B[0] + A[3] * B[1],
    A[0] * B[2] + A[2] * B[3],
    A[1] * B[2] + A[3] * B[3],
    A[0] * B[4] + A[2] * B[5] + A[4],
    A[1] * B[4] + A[3] * B[5] + A[5]
  ];
}

function marimeaFontului(font) {
  const m = String(font).match(/([\d.]+)px/);
  return m ? parseFloat(m[1]) : 0;
}

function creeazaPanza() {
  const desene = [];
  const filtre = [];
  let m = [1, 0, 0, 1, 0, 0];
  const stiva = [];
  let puncte = [];
  let cercuri = [];

  function pct(x, y) {
    return { x: m[0] * x + m[2] * y + m[4], y: m[1] * x + m[3] * y + m[5] };
  }
  function scara() { return (Math.hypot(m[0], m[1]) + Math.hypot(m[2], m[3])) / 2; }
  function adauga(x, y) { puncte.push(pct(x, y)); }
  function stil(v) { return (v && v.opriri) ? { gradient: v.opriri.slice() } : v; }

  function limite(ps) {
    if (!ps.length) return null;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of ps) {
      if (p.x < x0) x0 = p.x;
      if (p.y < y0) y0 = p.y;
      if (p.x > x1) x1 = p.x;
      if (p.y > y1) y1 = p.y;
    }
    return { x0: x0, y0: y0, x1: x1, y1: y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
  }

  let masuratori = 0;

  function inchide(op, culoare) {
    desene.push({
      op: op, stil: stil(culoare), alfa: ctx.globalAlpha,
      puncte: puncte.slice(), cercuri: cercuri.slice(), limite: limite(puncte)
    });
  }

  function gradient() {
    return { opriri: [], addColorStop: function (p, c) { this.opriri.push(c); } };
  }

  const ctx = {
    fillStyle: "#000", strokeStyle: "#000", lineWidth: 1,
    font: "", textAlign: "", textBaseline: "", lineCap: "", lineJoin: "",
    globalAlpha: 1, shadowColor: "", shadowBlur: 0, shadowOffsetY: 0,
    get filter() { return ctx._filter || "none"; },
    set filter(v) { ctx._filter = v; if (v && v !== "none") filtre.push(v); },
    /* Retine si dreptunghiul in care a cazut imaginea, nu numai ce imagine a
       fost. Fara el, orice desen mutat pe o stampila devine invizibil pentru
       teste: stii ca s-a copiat ceva, dar nu si unde — si atunci n-ai cum sa mai
       verifici ca scrisul a ramas in stanga, iar ilustratia in dreapta. */
    drawImage: function (sursa, a, b, c, d) {
      let x0 = 0, y0 = 0, x1 = 0, y1 = 0;
      if (arguments.length >= 9) {
        x0 = arguments[5]; y0 = arguments[6];
        x1 = x0 + arguments[7]; y1 = y0 + arguments[8];
      } else if (arguments.length >= 5) {
        x0 = a; y0 = b; x1 = a + c; y1 = b + d;
      } else if (arguments.length >= 3) {
        x0 = a; y0 = b;
        x1 = a + (sursa && sursa.width || 0);
        y1 = b + (sursa && sursa.height || 0);
      }
      desene.push({ op: "imagine", stil: null, sursa: sursa,
                    puncte: [], cercuri: [],
                    limite: { x0, y0, x1, y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 } });
    },

    save: function () {
      stiva.push({
        m: m.slice(), fillStyle: ctx.fillStyle, strokeStyle: ctx.strokeStyle,
        lineWidth: ctx.lineWidth, font: ctx.font, textAlign: ctx.textAlign,
        globalAlpha: ctx.globalAlpha
      });
    },
    restore: function () {
      const s = stiva.pop();
      if (!s) return;
      m = s.m;
      ctx.fillStyle = s.fillStyle; ctx.strokeStyle = s.strokeStyle;
      ctx.lineWidth = s.lineWidth; ctx.font = s.font;
      ctx.textAlign = s.textAlign; ctx.globalAlpha = s.globalAlpha;
    },
    setTransform: function (a, b, c, d, e, f) { m = [a, b, c, d, e, f]; },
    translate: function (x, y) { m = inmulteste(m, [1, 0, 0, 1, x, y]); },
    rotate: function (a) {
      m = inmulteste(m, [Math.cos(a), Math.sin(a), -Math.sin(a), Math.cos(a), 0, 0]);
    },
    scale: function (sx, sy) { m = inmulteste(m, [sx, 0, 0, sy, 0, 0]); },

    beginPath: function () { puncte = []; cercuri = []; },
    closePath: function () {},
    moveTo: function (x, y) { adauga(x, y); },
    lineTo: function (x, y) { adauga(x, y); },
    arcTo: function (x1, y1, x2, y2) { adauga(x1, y1); adauga(x2, y2); },
    quadraticCurveTo: function (x1, y1, x2, y2) { adauga(x1, y1); adauga(x2, y2); },
    bezierCurveTo: function (x1, y1, x2, y2, x3, y3) {
      adauga(x1, y1); adauga(x2, y2); adauga(x3, y3);
    },
    rect: function (x, y, l, i) {
      adauga(x, y); adauga(x + l, y); adauga(x + l, y + i); adauga(x, y + i);
    },
    roundRect: function (x, y, l, i) {
      adauga(x, y); adauga(x + l, y); adauga(x + l, y + i); adauga(x, y + i);
    },
    arc: function (x, y, r) {
      const c = pct(x, y);
      cercuri.push({ x: c.x, y: c.y, r: r * scara() });
      adauga(x - r, y - r); adauga(x + r, y + r);
    },
    ellipse: function (x, y, rx, ry) {
      const c = pct(x, y);
      cercuri.push({ x: c.x, y: c.y, r: rx * scara(), rx: rx * scara(), ry: ry * scara() });
      adauga(x - rx, y - ry); adauga(x + rx, y + ry);
    },

    fill: function () { inchide("fill", ctx.fillStyle); },
    stroke: function () { inchide("stroke", ctx.strokeStyle); },
    fillRect: function (x, y, l, i) {
      puncte = []; cercuri = [];
      adauga(x, y); adauga(x + l, y); adauga(x + l, y + i); adauga(x, y + i);
      inchide("fill", ctx.fillStyle);
    },
    strokeRect: function (x, y, l, i) {
      puncte = []; cercuri = [];
      adauga(x, y); adauga(x + l, y); adauga(x + l, y + i); adauga(x, y + i);
      inchide("stroke", ctx.strokeStyle);
    },
    clearRect: function () {},
    fillText: function (text, x, y) {
      const p = pct(x, y);
      desene.push({ op: "text", text: String(text), stil: stil(ctx.fillStyle),
                    alfa: ctx.globalAlpha, font: ctx.font,
                    marime: marimeaFontului(ctx.font) * scara(),
                    puncte: [p], cercuri: [], limite: limite([p]) });
    },
    strokeText: function () {},
    measureText: function (s) { masuratori++; return { width: String(s).length * 7 }; },

    /* Pânza adevărată știe să spună dacă un punct cade înăuntrul conturului
       desenat. A trebuit și aici, de când fiecare tușă de vopsea se taie la forma
       pe care ai atins-o: fără ea, testele scenei uleiului nu mai pot rula deloc.

       Se face prin numărarea trecerilor: tragi o rază din punct spre dreapta și
       numeri de câte ori taie laturile conturului. Impar înseamnă înăuntru.
       Curbele sunt aproximate prin capetele lor — pentru „e degetul pe corsaj sau
       pe mânecă" e destul, iar o flatare adevărată a curbelor ar fi mai mult cod
       de test decât cod de jucărie. */
    isPointInPath: function (x, y) {
      const p = puncte;
      if (p.length < 3) return false;
      let inauntru = false;
      for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
        const taie = (p[i].y > y) !== (p[j].y > y) &&
          x < (p[j].x - p[i].x) * (y - p[i].y) / ((p[j].y - p[i].y) || 1e-9) + p[i].x;
        if (taie) inauntru = !inauntru;
      }
      return inauntru;
    },
    clip: function () {},
    createLinearGradient: gradient,
    createRadialGradient: gradient,
    createPattern: function () { return null; }
  };

  return {
    ctx: ctx, desene: desene, filtre: filtre,
    get masuratori() { return masuratori; },
    /* Ce mutare a rămas pe pânză, și câte `save()`-uri n-au fost scoase.

       O funcție de desen care mută originea și iese fără `restore()` lasă mutarea
       pe pânză. Pe pânza ecranului nu se vede, fiindcă ea se ia de la capăt la
       fiecare cadru. Pe o pânză ascunsă, care se folosește din nou, mutările se
       înmulțesc una peste alta — și după câteva cadre tot desenul cade în afara ei.
       Așa a înghețat tabloul din sala a cincea. */
    get matrice() { return m.slice(); },
    get saveNescoase() { return stiva.length; },
    goleste: function () { desene.length = 0; filtre.length = 0; }
  };
}

/* ==========================================================================
   4. SUNET FALS — jucăria pornește audio la prima atingere
   ========================================================================== */

function parametruFals() {
  return {
    value: 0,
    setValueAtTime: function (v) { this.value = v; },
    linearRampToValueAtTime: function (v) { this.value = v; },
    exponentialRampToValueAtTime: function (v) { this.value = v; },
    /* Robinetele de volum se mută **lin**, cu `setTargetAtTime`, ca să nu sară
       un pocnet în boxe. Fals sau nu, parametrul trebuie să poată spune spre ce
       valoare a fost trimis — altfel n-are cine verifica volumul. */
    setTargetAtTime: function (v) { this.value = v; },
    cancelScheduledValues: function () {},
    setValueCurveAtTime: function () {}
  };
}
function nodFals() {
  return {
    type: "", buffer: null, loop: false,
    frequency: parametruFals(), gain: parametruFals(), Q: parametruFals(),
    detune: parametruFals(), playbackRate: parametruFals(),
    connect: function (tinta) { return tinta; },
    disconnect: function () {},
    start: function (cand) { this.pornitLa = cand; },
    /* Ține minte când i s-a spus să tacă. Muzica muzeului se scrie cu paisprezece
       secunde înainte, iar oprirea ei trebuie să taie și notele deja programate —
       altfel se aud două execuții deodată. Fals sau nu, nodul trebuie să poată
       spune dacă a fost tăiat. */
    stop: function (cand) { this.opritLa = cand; this.oprita = true; }
  };
}
function AudioContextFals() {
  this.currentTime = 0;
  this.sampleRate = 44100;
  this.state = "running";
  this.destination = nodFals();
  this.resume = function () {};
  this.createOscillator = nodFals;
  this.createGain = nodFals;
  this.createBufferSource = nodFals;
  this.createBiquadFilter = nodFals;
  this.createBuffer = function (canale, lungime) {
    return { length: lungime, numberOfChannels: canale,
             getChannelData: function () { return new Float32Array(lungime); } };
  };
}

/* ==========================================================================
   5. ÎNCĂRCAREA JUCĂRIEI DIN index.html
   ========================================================================== */

/* Nu copiem codul aici: îl citim din index.html și îl rulăm cu o pânză falsă,
   un ceas fals și un sunet fals. Așa fișierul testat rămâne exact fișierul
   livrat, iar regula „totul într-un singur fișier" nu se strică din cauza
   testelor. Ce încă nu e scris se exportă cu `typeof`, ca lipsa unui simbol
   să pice un singur test, nu toată încărcarea. */

const EXPORTURI = `
return {
  /* Cadrul **fără plasă**. În joc, o greșeală dintr-un cadru e prinsă și scrisă
     în consolă, ca jucăria să nu înțepenească pe veci. La teste vrem exact pe dos:
     o greșeală trebuie să pice testul, nu să fie înghițită și să treacă verde. */
  deseneazaCursorul: typeof deseneazaCursorul !== "undefined" ? deseneazaCursorul : null,
  T: typeof T !== "undefined" ? T : null,
  LIMBI: typeof LIMBI !== "undefined" ? LIMBI : null,
  NUMELE_LIMBILOR: typeof NUMELE_LIMBILOR !== "undefined" ? NUMELE_LIMBILOR : null,
  ORDINEA_LIMBILOR: typeof ORDINEA_LIMBILOR !== "undefined" ? ORDINEA_LIMBILOR : null,
  schimbaLimba: typeof schimbaLimba !== "undefined" ? schimbaLimba : null,
  limba: function () { return typeof limba !== "undefined" ? limba : null; },
  stampilele: typeof stampilele !== "undefined" ? stampilele : null,
  STAMPILE_FARA_TEXT: typeof STAMPILE_FARA_TEXT !== "undefined" ? STAMPILE_FARA_TEXT : null,
  /* Cele două pânze pe care schimbarea limbii **nu** are voie să le arunce:
     acolo stă ce a pictat și ce a șters jucătorul. */
  stratulDePictura: function () { return typeof stratulDePictura !== "undefined" ? stratulDePictura : null; },
  panzaCarbunelui: function () { return typeof panzaCarbunelui !== "undefined" ? panzaCarbunelui : null; },
  cadru: typeof unCadru !== "undefined" ? unCadru : cadru,

  orizont: orizont,
  intre: intre,

  deseneazaInvitatia: deseneazaInvitatia,
  manutaAlba: typeof manutaAlba !== "undefined" ? manutaAlba : null,
  ALB_MANUSA: typeof ALB_MANUSA !== "undefined" ? ALB_MANUSA : null,
  PAGINI_INVITATIE: typeof PAGINI_INVITATIE !== "undefined" ? PAGINI_INVITATIE : null,
  ARTICOLE_MANUAL: ARTICOLE_MANUAL,

  pete: pete, adaugaPata: adaugaPata,

  BALOANE_IN_AER: typeof BALOANE_IN_AER !== "undefined" ? BALOANE_IN_AER : null,

/* Jucăria stă în mai multe fișiere, sub js/. Nu ținem aici o listă a lor: o
   citim din index.html, în ordinea în care le încarcă pagina. Așa lista are un
   singur stăpân — dacă apare un fișier nou, testele îl iau de la sine, și nu se
   poate întâmpla ca pagina să ruleze un cod și testele altul. */
async function citesteSursa() {
  const raspuns = await fetch("index.html?t=" + Date.now());
  if (!raspuns.ok) throw new Error("nu pot citi index.html: " + raspuns.status);
  const html = await raspuns.text();
  const cai = [...html.matchAll(/<script\s+src="([^"]+)"><\/script>/g)].map(m => m[1]);
  if (!cai.length) throw new Error("index.html nu încarcă niciun fișier din js/");
  const bucati = [];
  for (const cale of cai) {
    const r = await fetch(cale + "?t=" + Date.now());
    if (!r.ok) throw new Error("nu pot citi " + cale + ": " + r.status);
    /* Un titlu peste fiecare bucată: dacă vreo eroare arată un număr de linie,
       să se vadă din ce fișier vine. */
    bucati.push(`/* ---- ${cale} ---- */
${await r.text()}`);
  }
  return bucati.join(`
`);
}

        getContext: function () { return ascunsa.ctx; }
      };
      panzeAscunse.push(el);
      return el;
    }
  };
  const ascultatori = {};
  const fereastra = {
    innerWidth: o.latime || 1200,
    innerHeight: o.inaltime || 800,
    devicePixelRatio: 1,
    /* Cu `audioStricat`, browserul refuză contextul — fereastră privată, sunet
       oprit din sistem, browser vechi. Jucăria trebuie să meargă mută, nu să
       moară. */
    AudioContext: o.audioStricat
      ? function () { throw new Error("sunetul e oprit din sistem"); }
      : AudioContextFals,
    addEventListener: function (nume, f) { (ascultatori[nume] = ascultatori[nume] || []).push(f); }
  };
  const ceas = { t: 0 };
  const cronometru = { now: function () { return ceas.t; } };

  /* Cămara jucăriei, falsă și numai a acestui test. Fără ea, testele scriau în
     `localStorage`-ul adevărat al browserului: rulai suita, și jucăria uita ce
     limbă alesese jucătorul — rămânea cu limba ultimului test care a schimbat-o.

     `porneste({ pastrata: "fr" })` o umple dinainte, ca și cum jucătorul ar fi
     ales franceza data trecută: așa se poate încerca ce face jucăria la
     deschidere, fără să atingă nimeni memoria adevărată a browserului. */
  const camara = {};
  if (o.pastrata) camara.limba = String(o.pastrata);
  if (o.volume) {
    for (const fel of Object.keys(o.volume)) camara["volum." + fel] = String(o.volume[fel]);
  }
  if (o.dispozitiv) camara.dispozitiv = String(o.dispozitiv);
  const depozitFals = {
    getItem: function (k) {
      return Object.prototype.hasOwnProperty.call(camara, k) ? camara[k] : null;
    },
    setItem: function (k, v) { camara[k] = String(v); },
    removeItem: function (k) { delete camara[k]; }
  };
  /* Un browser fals, tăcut. Limba jucăriei nu se mai ia de la browser, dar dacă
     vreodată o scenă întreabă ceva despre el, să întrebe aici, nu afară — altfel
     suita ar merge altfel pe calculatoare diferite. */
  const navigatorFals = { language: "ro", languages: ["ro"] };

  const fabrica = new Function("document", "window", "requestAnimationFrame", "performance",
                               "localStorage", "navigator",
                               sursa + "\n" + EXPORTURI);
  const j = fabrica(doc, fereastra, function () {}, cronometru, depozitFals, navigatorFals);
  j.camara = camara;

  j.panza = panza;
  j.desene = panza.desene;
  j.filtre = panza.filtre;
  j.goleste = panza.goleste;
  j.panzeAscunse = panzeAscunse;
  j.panzaPrincipala = panza;

  /* Cu ce limbă s-a deschis jucăria, **înainte** să se amestece testul: engleza,
     sau cea ținută minte din cămară. De aici o iau testele care verifică tocmai
     deschiderea. */
  j.limbaDeLaInceput = j.limba();
  /* Și dacă deschiderea a scris ceva în cămară. Trebuie să fie „nu": jucăria
     ține minte numai ce a **ales** jucătorul, nu și limba de la care pornește.
     Se prinde acum, înainte ca testul să-i ceară româna — pe urmă ar fi scris. */
  j.aScrisLaDeschidere = Object.prototype.hasOwnProperty.call(camara, "limba");

  /* Pe urmă testele joacă **în română**. Jucăria se deschide în engleză, dar
     româna e originalul — acolo s-a gândit fiecare frază, și tot în ea sunt
     scrise aserțiunile care caută text pe ecran.

     Cine vrea să încerce altă limbă o cere anume: `porneste({ limba: "en" })`. */
  j.schimbaLimba(o.limba || "ro");
  j.ceas = ceas;

  // Rulează bucla de animație adevărată, cu pași de câte un cadru.
  j.avanseaza = function (ms, pas) {
    const p = pas || 16;
    let ramas = ms === undefined ? 16 : ms;
    do {
      const d = Math.min(p, ramas) || p;
      ceas.t += d;
      j.cadru(ceas.t);
      ramas -= d;
    } while (ramas > 0);
  };

  /* Ca `avanseaza`, dar aruncă din când în când ce s-a desenat.

     Pânza falsă ține minte fiecare operație de desen, ca să poată fi cercetată pe
     urmă. Câtă vreme scenele desenau câteva sute de operații pe cadru, nu conta.
     Sala a noua desenează o mie, iar un test care o duce o mie de cadre până la
     capăt strânge un milion de obiecte pe care nu le citește nimeni — suita a
     sărit de la douăzeci de secunde la două minute.

     Deci: când testul se uită la **starea** scării, nu la desenul ei, se merge cu
     asta și se golesc urmele din șaizeci în șaizeci de cadre. Cine vrea să vadă
     ce s-a desenat folosește `doar` sau `cadruCurat`, care oricum golesc întâi. */
  j.avanseazaUsor = function (ms, pas) {
    const p = pas || 16;
    let ramas = ms === undefined ? 16 : ms, cate = 0;
    do {
      const d = Math.min(p, ramas) || p;
      ceas.t += d;
      j.cadru(ceas.t);
      if (++cate % 60 === 0) panza.goleste();
      ramas -= d;
    } while (ramas > 0);
  };

  // Un singur cadru, cu pânza golită înainte: întoarce doar ce s-a desenat acum.
  j.cadruCurat = function () {
    panza.goleste();
    ceas.t += 16;
    j.cadru(ceas.t);
    return panza.desene.slice();
  };

  // Ce desenează o singură funcție, fără restul scenei.
  j.doar = function (f) {
    panza.goleste();
    f();
    return panza.desene.slice();
  };

  j.atinge = function (x, y) {
    const lista = ascultatori["pointerdown"] || [];
    for (const f of lista) f({ clientX: x, clientY: y });
  };

  /* Redimensionarea din teste: schimbăm fereastra falsă și chemăm funcția
     scenei. Numele se bat cap în cap — de-aia o punem deoparte întâi. */
  const redimScena = j.redimensioneaza;
  j.redimensioneaza = function (l, i) {
    fereastra.innerWidth = l; fereastra.innerHeight = i;
    redimScena();
  };

  return j;
}

   6. AJUTOARE DE INTEROGARE A DESENULUI

/* Deschiderea are trei pagini, iar atingerea le întoarce. Jocul pornește abia
   de pe ultima — testele care vor să ajungă în joc trec întâi prin ele. */
function incepeJocul(j, x, y) {
  for (let k = 0; k < 5 && j.stare() === "intuneric"; k++) {
    j.atinge(x, y);
    j.avanseaza(120);
  }
}

function culorileDin(desene) {
  const set = new Set();
  for (const d of desene) {
    if (typeof d.stil === "string") set.add(d.stil.toLowerCase());
    else if (d.stil && d.stil.gradient) for (const c of d.stil.gradient) set.add(String(c).toLowerCase());
  }
  return set;
}

function areCuloarea(desene, culoare) {
  return culorileDin(desene).has(String(culoare).toLowerCase());
}

function formeCu(desene, culoare) {
  const c = String(culoare).toLowerCase();
  return desene.filter(function (d) {
    if (typeof d.stil === "string") return d.stil.toLowerCase() === c;
    if (d.stil && d.stil.gradient) return d.stil.gradient.some(function (g) { return String(g).toLowerCase() === c; });
    return false;
  });
}

function textele(desene) {
  return desene.filter(function (d) { return d.op === "text"; }).map(function (d) { return d.text; });
}

function totTextul(desene) { return textele(desene).join(" "); }

/* Scrisul de pe un cadru, **cu tot cu cel adus de pe stampile**. Textele care
   nu se schimba niciodata se scriu o data pe o panza ascunsa si pe urma se
   copiaza, ca sa nu se masoare fiecare cuvant de saizeci de ori pe secunda. Pe
   ecran arata la fel; pentru un test care se uita numai la operatiile de scris,
   dispar cu totul. */
function totScrisul(desene) {
  let tot = totTextul(desene);
  for (const d of desene) {
    if (d.op !== "imagine" || !d.sursa || !d.sursa._panza) continue;
    tot += " " + totTextul(d.sursa._panza.desene);
  }
  return tot;
}

/* Unde a cazut pe ecran stampila care poarta textul cautat. */
function undeEScrisul(desene, tipar) {
  for (const d of desene) {
    if (d.op === "text" && tipar.test(d.text) && d.limite) return d.limite;
    if (d.op !== "imagine" || !d.sursa || !d.sursa._panza) continue;
    if (tipar.test(totTextul(d.sursa._panza.desene))) return d.limite;
  }
  return null;
}

// Cea mai lungă cale desenată — folosit ca „are curbe, nu e un dreptunghi sec".
function celMaiLungTraseu(desene) {
  let max = 0;
  for (const d of desene) if (d.puncte && d.puncte.length > max) max = d.puncte.length;
  return max;
}

function seSuprapun(a, b) {
  return !(a.x1 <= b.x0 || b.x1 <= a.x0 || a.y1 <= b.y0 || b.y1 <= a.y0);
}

// Toate cercurile/elipsele desenate, în coordonatele scenei.
function cercurileDin(desene, culoare) {
  const out = [];
  for (const d of desene) {
    if (culoare !== undefined) {
      const c = String(culoare).toLowerCase();
      const potrivit = typeof d.stil === "string" ? d.stil.toLowerCase() === c
        : (d.stil && d.stil.gradient ? d.stil.gradient.some(function (g) { return String(g).toLowerCase() === c; }) : false);
      if (!potrivit) continue;
    }
    for (const c of d.cercuri || []) out.push(c);
  }
  return out;
}

function existaCercLanga(cercuri, x, y, toleranta) {
  return cercuri.some(function (c) { return Math.hypot(c.x - x, c.y - y) <= toleranta; });
}

// „Colorat" înseamnă că roșul, verdele și albastrul nu sunt aproape egale.
function viuColorat(c) {
  const m = String(c).match(/^#([0-9a-f]{6})$/i);
  if (!m) return false;
  const n = parseInt(m[1], 16);
  const r = (n >> 16) & 255, v = (n >> 8) & 255, a = n & 255;
  return Math.max(r, v, a) - Math.min(r, v, a) > 25;
}

  test("in zare se vede un sat, nu numai camp gol", function () {
    /* Grau, un copac si o casa pot fi oriunde. Cateva acoperisuri pe linia
       orizontului spun ca oamenii astia au de unde veni si unde se intoarce. */
    const j = porneste({ latime: 1400, inaltime: 800 });
    inCampie(j);
    const panze = j.panzeAscunse.map(function (p) { return p._panza; })
      .filter(function (p) { return p && p.desene && p.desene.length > 400; });
    adevarat(panze.length > 0, "n-am gasit panza tabloului");
    const d = panze[0].desene;
    const oriz = 800 * 0.44;   // ORIZONT_TABLOU din inaltimea panzei
    let marunte = 0;
    for (const f of d) {
      if (!f.limite) continue;
      const inalt = f.limite.y1 - f.limite.y0, lat = f.limite.x1 - f.limite.x0;
      if (f.limite.y0 > oriz - 34 && f.limite.y1 < oriz + 44 &&
          lat > 2 && lat < 64 && inalt > 2 && inalt < 44) marunte++;
    }
    adevarat(marunte >= 12,
      "in zare se vad doar " + marunte + " pete marunte - nu se citeste un sat");
  });

  test("usa se ingusteaza cand se deschide, nu se rastoarna", function () {
    /* Pe o panza plata nu exista adancime in care sa se roteasca un canat: daca il
       invartesti, se rastoarna lateral ca o scandura care cade. O usa vazuta din
       fata ramane dreapta si se ingusteaza spre balama. */
    const j = porneste({ latime: 1400, inaltime: 800 });
    inCampie(j);
    const K = j.geomCasa(1400, 800);
    function latimeaCanaturilor(deschidere) {
      j.goleste();
      j.usileCasei(j.panza.ctx, 1400, 800, deschidere);
      /* Masor tablia de sus a canatului, nu tot canatul: golul usii si lumina
         dinauntru sunt si ele inalte cat usa, si mi-ar da mereu aceeasi latime. */
      let lat = 0;
      for (const f of j.desene) {
        if (!f.limite) continue;
        const h = f.limite.y1 - f.limite.y0;
        if (h > K.usaH * 0.28 && h < K.usaH * 0.42) lat = Math.max(lat, f.limite.x1 - f.limite.x0);
      }
      return lat;
    }
    const inchisa = latimeaCanaturilor(0);
    const deschisa = latimeaCanaturilor(1);
    adevarat(inchisa > K.usaW * 0.3, "canatul inchis nu se vede deloc: " + inchisa);
    adevarat(deschisa < inchisa * 0.6,
      "canatul deschis e tot lat (" + Math.round(deschisa) + " fata de " +
      Math.round(inchisa) + ") - nu se ingusteaza");
  });

    const cuFata = chipuriCuOchi(0);

  test("intoarcerea nu e o clipire, dar nici o strivire", function () {
    /* La mijlocul rasucirii omul se ingusteaza si se largeste la loc, ca sa nu
       sara chipul in ceafa de la un cadru la altul.

       Cat de mult se ingusteaza a fost prima oara gresit: latimea scadea cu
       cosinusul unghiului, pana se vedea numai muchia — regula canatului de usa.
       Pentru o usa e chiar adevarul, fiindca o usa **este** un dreptunghi plat.
       Un om nu e: strans la a saptea parte din latime, nu se citea ca intors, ci
       ca stricat, si tinea o treime de secunda. Testul apara acum amandoua
       marginile: rasucirea trebuie sa se vada, dar omul trebuie sa ramana om. */
    const j = porneste({ latime: 1400, inaltime: 800 });
    inCampie(j);
    function latimea(pleaca) {
      j.goleste();
      j.taranIn(j.panza.ctx, 1400, 800, 0.3, 0.9, 0.5, "barbat", 0, 0, 0, 1, pleaca);
      let lat = 0;
      for (const f of j.desene) if (f.limite) lat = Math.max(lat, f.limite.x1 - f.limite.x0);
      return lat;
    }
    const dreptInFata = latimea(0);
    let ceaMaiSubtire = dreptInFata, unde = 0;
    for (let p = 0.02; p <= 0.09; p += 0.002) {
      const l = latimea(p);
      if (l < ceaMaiSubtire) { ceaMaiSubtire = l; unde = p; }
    }
    const intors = latimea(0.3);
    adevarat(ceaMaiSubtire < dreptInFata * 0.85,
      "rasucirea nu se vede deloc: " + Math.round(ceaMaiSubtire) + " fata de " + Math.round(dreptInFata));
    adevarat(ceaMaiSubtire > dreptInFata * 0.5,
      "omul e strivit la " + Math.round(ceaMaiSubtire / dreptInFata * 100) + "% din latime, la plecare " + unde.toFixed(3));
    adevarat(intors > ceaMaiSubtire * 1.05, "nu se mai largeste la loc dupa ce s-a intors");
  });

    atinge(j.s3.plicX, j.s3.plicY);
    egal(j.s3.faza, "scrisoare", "plicul nu se deschide");
    atinge(j.W() / 2, j.H() / 2);
    egal(j.s3.faza, "sonerie", "scrisoarea nu duce la sonerie");

    const numeSunete = (sursa.match(/^function (sunet\w+|nota|zgomot\w*)\(/gm) || [])

  test("nicio sala nu lasa o mutare pe vreo panza ascunsa", function () {
    /* Bugul care a oprit tabloul din sala a cincea, si clasa lui intreaga.

       `taranIn` incepe cu `c.save()`, muta originea pe om, il inclina si il
       ingusteaza, si se termina cu `c.restore()`. In mijloc era un `return`,
       pus acolo ca sa spuna „naframa din spate e gata, nu o mai desena si pe cea
       din fata". Numai ca un `return` nu iese dintr-un `if`, ci din toata
       functia — deci de fiecare data cand femeia se vedea din spate, pe panza de
       compunere ramanea o mutare nescoasa.

       Panza aia se foloseste din nou la fiecare cadru. Mutarile se inmulteau una
       peste alta, si dupa vreo opt cadre tot ce se desena cadea la cateva mii de
       pixeli in afara ei, strivit la cateva procente din latime. Pana si stersul
       de la inceputul cadrului cadea alaturi. Din afara: tabloul ingheata exact
       cand oamenii se intorceau spre casa, cu ei ramasi in lan ca doua dungi.

       Testul nu se uita la un singur loc: dupa cateva cadre din fiecare sala,
       toate panzele trebuie sa aiba mutarea la loc si stiva de `save` goala. */
    const IDENTITATE = [1, 0, 0, 1, 0, 0];
    function curata(pz, unde, gasite) {
      const m = pz.matrice;
      for (let k = 0; k < 6; k++) {
        if (Math.abs(m[k] - IDENTITATE[k]) > 1e-6) {
          gasite.push(unde + ": mutare ramasa [" + m.map(function (v) { return v.toFixed(3); }).join(", ") + "]");
          return;
        }
      }
      if (pz.saveNescoase) gasite.push(unde + ": " + pz.saveNescoase + " save() nescoase");
    }

    const SALI = [
      ["muzeu", "intrareScena3"], ["galerie", "intraInGalerie"], ["campie", "intraInCampie"],
      ["foc", "intraInFoc"], ["gheata", "intraInGheata"], ["ulei", "intraInUlei"],
      ["acuarela", "intraInAcuarela"], ["colaj", "intraInColaj"],
      ["carbune", "intraInCarbune"], ["vid", "intraInVid"]
    ];
    const gasite = [];
    for (const [nume, intrare] of SALI) {
      const j = porneste({ latime: 1400, inaltime: 800 });
      j.mergiLaStarea(nume);
      j[intrare](j.ceas.t);
      j.avanseazaUsor(2500);
      /* In campie ii trimitem si spre casa: acolo se vedea greseala, fiindca
         numai intorsi cu spatele ieseau din functie pe usa gresita. */
      if (nume === "campie") {
        for (let k = 0; k < 14 && j.s5.faza !== "casa"; k++) { j.click5(j.ceas.t); j.avanseazaUsor(200); }
        j.avanseazaUsor(2200);
      }
      curata(j.panzaPrincipala, nume + " / panza ecranului", gasite);
      j.panzeAscunse.forEach(function (el, i) {
        if (el._panza) curata(el._panza, nume + " / panza ascunsa " + i, gasite);
      });
    }
    egal(gasite.length, 0, gasite.join("  |  "));
  });

      const lat = 60, inalt = 40, date = new Uint8ClampedArray(lat * inalt * 4);
      for (let k = 0; k < lat * inalt; k++) umple(date, k * 4, k % lat, Math.floor(k / lat));
      return { getImageData: function () { return { data: date }; } };
    }
    const neagra = panzaCu(function (d, i) { d[i] = d[i + 1] = d[i + 2] = 0; d[i + 3] = 255; });
    const plina = panzaCu(function (d, i, x, y) {
      d[i] = (x * 4) % 256; d[i + 1] = (y * 6) % 256; d[i + 2] = 255 - (x * 3) % 256; d[i + 3] = 255;
    });
    const nNeagra = j.cataViataEInPoza(neagra, 60, 40);
    const nPlina = j.cataViataEInPoza(plina, 60, 40);

     românească sub un joc care vorbea deja nemțește: o frază scrisă de-a dreptul
     în scenă nu dă nicio eroare, nu pică niciun test, doar rămâne în română
     pentru toată lumea. Se vede numai cu ochii, și numai dacă ajungi în sala aia
     cu limba schimbată.

     Aici o vede codul: orice șir dintr-o scenă care are diacritice românești și
     se termină ca o frază e un rând uitat afară din dicționar. Comentariile se
     scot întâi — ele au voie, și trebuie, să fie în română. */
  test("nicio frază românească nu stă scrisă în afara dicționarului", function () {
    function faraComentarii(text) {
      return text.replace(/\/\*[\s\S]*?\*\//g, " ")
                 .replace(/(^|[^:])\/\/[^\n]*/g, "$1");
    }
    const bucati = sursa.split(/\/\* ---- (js\/[^ ]+) ---- \*\//);
    const gasite = [];
    for (let i = 1; i < bucati.length; i += 2) {
      const cale = bucati[i], cod = faraComentarii(bucati[i + 1] || "");
      if (cale === "js/00-limbi.js") continue;      // chiar acolo e locul lor
      const potriviri = cod.match(/'[^'\n]*[ăâîșțĂÂÎȘȚ][^'\n]*[.!?…]\s*'/g) || [];
      for (const p of potriviri) gasite.push(cale + ": " + p);
    }
    egal(gasite.length, 0,
         "rânduri rămase în afara dicționarului:\n   " + gasite.join("\n   "));
  });

       comparat. Iar prima pagină are nevoie de câteva clipe ca să se aprindă. */
    function titlulDe(j) {
      j.avanseaza(2200);
      return totTextul(j.cadruCurat()).replace(/\s+/g, " ");
    }
    const ro = porneste({ latime: 1400, inaltime: 800 });
    const en = porneste({ latime: 1400, inaltime: 800, limba: "en" });
    const scrisRo = titlulDe(ro), scrisEn = titlulDe(en);
    adevarat(scrisRo.indexOf(ro.LIMBI.ro["titlu"]) !== -1,
             "titlul românesc nu apare la deschidere: " + scrisRo);
    adevarat(scrisEn.indexOf(en.LIMBI.en["titlu"]) !== -1,
             "titlul englezesc nu apare la deschidere: " + scrisEn);
    adevarat(scrisRo.indexOf(ro.LIMBI.en["titlu"]) === -1,
             "jucăria în română arată și titlul englezesc");
  });
}

(async function () {
  const rezumat = document.getElementById("rezumat");
  try {
    sursa = await citesteSursa();
  } catch (e) {
    rezumat.className = "rosu";
    rezumat.textContent = "nu am putut încărca jucăria: " + e.message;
    return;
  }
  ruleaza();
  rezumat.className = cazute ? "rosu" : "verde";
  rezumat.textContent = cazute
    ? cazute + " căzute, " + trecute + " trecute"
    : "toate cele " + trecute + " teste trec";

  const tot = durate.reduce(function (a, d) { return a + d.ms; }, 0);
  const lente = durate.slice().sort(function (a, b) { return b.ms - a.ms; }).slice(0, 5);
  const jos = document.createElement("div");
  jos.className = "motiv";
  jos.style.paddingLeft = "0";
  jos.style.marginTop = "1.4rem";
  jos.textContent = "\u23f1 " + (tot / 1000).toFixed(1) + " s în total. Cele mai lente:\n" +
    lente.map(function (d) {
      return "   " + (d.ms / 1000).toFixed(2) + " s  " + d.nume;
    }).join("\n");
  lista.appendChild(jos);
})();
</script>

<!-- ============================================================
     REÎNCĂRCAREA TESTELOR

     Aici pagina **se reîncarcă singură**, spre deosebire de joc: la teste n-ai ce
     pierde. N-are drum parcurs, n-are progres — le pornești, se duc până la capăt
     în două secunde, iar dacă între timp s-a schimbat un fișier, singurul lucru
     rezonabil e să le rulezi din nou.

     Așa, cât timp ține fereastra asta deschisă, ea arată în permanență starea
     adevărată a suitei, fără să atingă nimeni nimic.
     ============================================================ -->
<script>
(function () {
  var ultimul = null;
  function intreaba() {
    fetch('/__ceas', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (t) {
        if (t === null) return;
        if (ultimul === null) ultimul = t;
        else if (t !== ultimul) location.reload();
      })
      .catch(function () { /* de pe file:// testele oricum nu merg */ });
  }
  /* Pe lângă întrebarea din două în două secunde, mai întreabă **ori de câte ori
     te întorci la fereastră**. Browserul încetinește ceasurile în filele pe care
     nu le privește nimeni — până la o dată pe minut — așa că, fără asta, te-ai
     fi întors la joc și ai fi așteptat degeaba un semn care venea târziu. */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) intreaba();
  });
  window.addEventListener('focus', intreaba);

  intreaba();
  setInterval(intreaba, 2000);
})();
</script>
