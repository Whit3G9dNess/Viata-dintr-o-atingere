/* ==========================================================================
   1. MINI-CADRU DE TESTE
   ========================================================================== */

const lista = document.getElementById("lista");
let trecute = 0, cazute = 0;

function sectiune(titlu) {
  const h = document.createElement("h2");
  h.textContent = titlu;
  lista.appendChild(h);
}

function test(nume, corp) {
  const rand = document.createElement("div");
  rand.className = "test";
  try {
    corp();
    trecute++;
    rand.classList.add("trecut");
    rand.textContent = "✅ " + nume;
    lista.appendChild(rand);
  } catch (e) {
    cazute++;
    rand.classList.add("cazut");
    rand.textContent = "❌ " + nume;
    lista.appendChild(rand);
    const motiv = document.createElement("div");
    motiv.className = "motiv";
    motiv.textContent = e && e.message ? e.message : String(e);
    lista.appendChild(motiv);
  }
}

function cade(mesaj) { throw new Error(mesaj); }

function adevarat(conditie, mesaj) {
  if (!conditie) cade(mesaj || "așteptam adevărat");
}

function egal(gasit, asteptat, mesaj) {
  if (gasit !== asteptat) {
    cade((mesaj ? mesaj + " — " : "") + "așteptam " + JSON.stringify(asteptat) +
         ", am găsit " + JSON.stringify(gasit));
  }
}

function aproape(gasit, asteptat, toleranta, mesaj) {
  const tol = toleranta === undefined ? 1e-6 : toleranta;
  if (!(Math.abs(gasit - asteptat) <= tol)) {
    cade((mesaj ? mesaj + " — " : "") + "așteptam ~" + asteptat + " (±" + tol +
         "), am găsit " + gasit);
  }
}

Math.random = function () {
  samanta = (samanta * 1103515245 + 12345) % 2147483648;
  return samanta / 2147483648;
};

function inmulteste(A, B) {
  return [
    A[0] * B[0] + A[2] * B[1],
    A[1] * B[0] + A[3] * B[1],
    A[0] * B[2] + A[2] * B[3],
    A[1] * B[2] + A[3] * B[3],
    A[0] * B[4] + A[2] * B[5] + A[4],
    A[1] * B[4] + A[3] * B[5] + A[5]
  ];

function marimeaFontului(font) {
  const m = String(font).match(/([\d.]+)px/);
  return m ? parseFloat(m[1]) : 0;
}

  const desene = [];
  const filtre = [];
  let m = [1, 0, 0, 1, 0, 0];
  const stiva = [];
  let puncte = [];
  let cercuri = [];

  function pct(x, y) {
    return { x: m[0] * x + m[2] * y + m[4], y: m[1] * x + m[3] * y + m[5] };

  function scara() { return (Math.hypot(m[0], m[1]) + Math.hypot(m[2], m[3])) / 2; }

    if (!ps.length) return null;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of ps) {
      if (p.x < x0) x0 = p.x;
      if (p.y < y0) y0 = p.y;
      if (p.x > x1) x1 = p.x;
      if (p.y > y1) y1 = p.y;

    return { x0: x0, y0: y0, x1: x1, y1: y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };

  function inchide(op, culoare) {
    desene.push({
      op: op, stil: stil(culoare), alfa: ctx.globalAlpha,
      puncte: puncte.slice(), cercuri: cercuri.slice(), limite: limite(puncte)

    arcTo: function (x1, y1, x2, y2) { adauga(x1, y1); adauga(x2, y2); },
    quadraticCurveTo: function (x1, y1, x2, y2) { adauga(x1, y1); adauga(x2, y2); },
    bezierCurveTo: function (x1, y1, x2, y2, x3, y3) {
      adauga(x1, y1); adauga(x2, y2); adauga(x3, y3);
    },
    rect: function (x, y, l, i) {
      adauga(x, y); adauga(x + l, y); adauga(x + l, y + i); adauga(x, y + i);
    },
    roundRect: function (x, y, l, i) {
      adauga(x, y); adauga(x + l, y); adauga(x + l, y + i); adauga(x, y + i);
    },
    arc: function (x, y, r) {
      const c = pct(x, y);
      cercuri.push({ x: c.x, y: c.y, r: r * scara() });
      adauga(x - r, y - r); adauga(x + r, y + r);
    },
    ellipse: function (x, y, rx, ry) {
      const c = pct(x, y);
      cercuri.push({ x: c.x, y: c.y, r: rx * scara(), rx: rx * scara(), ry: ry * scara() });
      adauga(x - rx, y - ry); adauga(x + rx, y + ry);
    },

    fill: function () { inchide("fill", ctx.fillStyle); },
    stroke: function () { inchide("stroke", ctx.strokeStyle); },
    fillRect: function (x, y, l, i) {
      puncte = []; cercuri = [];
      adauga(x, y); adauga(x + l, y); adauga(x + l, y + i); adauga(x, y + i);
      inchide("fill", ctx.fillStyle);
    },
    strokeRect: function (x, y, l, i) {

      adauga(x, y); adauga(x + l, y); adauga(x + l, y + i); adauga(x, y + i);

    },

/* Jucăria stă în mai multe fișiere, sub js/. Nu ținem aici o listă a lor: o
   citim din index.html, în ordinea în care le încarcă pagina. Așa lista are un
   singur stăpân — dacă apare un fișier nou, testele îl iau de la sine, și nu se
   poate întâmpla ca pagina să ruleze un cod și testele altul. */
async function citesteSursa() {
  const raspuns = await fetch("index.html?t=" + Date.now());
  if (!raspuns.ok) throw new Error("nu pot citi index.html: " + raspuns.status);
  const html = await raspuns.text();
  const cai = [...html.matchAll(/<script\s+src="([^"]+)"><\/script>/g)].map(m => m[1]);
  if (!cai.length) throw new Error("index.html nu încarcă niciun fișier din js/");
  const bucati = [];
  for (const cale of cai) {
    const r = await fetch(cale + "?t=" + Date.now());
    if (!r.ok) throw new Error("nu pot citi " + cale + ": " + r.status);
    /* Un titlu peste fiecare bucată: dacă vreo eroare arată un număr de linie,
       să se vadă din ce fișier vine. */
    bucati.push(`/* ---- ${cale} ---- */
${await r.text()}`);
  }
  return bucati.join(`
`);
}

// Pornește o jucărie nouă, izolată: fiecare test primește starea lui.
function porneste(optiuni) {
  const o = optiuni || {};
  reseteazaAleatorul(o.samanta || 1);

  const panza = creeazaPanza();
  const element = {
    width: 0, height: 0, style: {},
    getContext: function () { return panza.ctx; },
    addEventListener: function () {}
  };
  const panzeAscunse = [];
  const doc = {
    getElementById: function () { return element; },
    // pânzele ascunse (folosite ca să nu repictăm peisajul la fiecare cadru)
    createElement: function (tag) {
      if (String(tag).toLowerCase() !== "canvas") return { style: {} };
      const ascunsa = creeazaPanza();
      const el = {
        width: 0, height: 0, _panza: ascunsa,
        getContext: function () { return ascunsa.ctx; }
      };
      panzeAscunse.push(el);
      return el;
    }
  };
  const ascultatori = {};
  const fereastra = {
    innerWidth: o.latime || 1200,
    innerHeight: o.inaltime || 800,
    devicePixelRatio: 1,
    AudioContext: AudioContextFals,
    addEventListener: function (nume, f) { (ascultatori[nume] = ascultatori[nume] || []).push(f); }
  };
  const ceas = { t: 0 };
  const cronometru = { now: function () { return ceas.t; } };

  const fabrica = new Function("document", "window", "requestAnimationFrame", "performance",
                               sursa + "\n" + EXPORTURI);
  const j = fabrica(doc, fereastra, function () {}, cronometru);

  j.panza = panza;
  j.desene = panza.desene;
  j.filtre = panza.filtre;
  j.goleste = panza.goleste;
  j.panzeAscunse = panzeAscunse;
  j.ceas = ceas;

  // Rulează bucla de animație adevărată, cu pași de câte un cadru.
  j.avanseaza = function (ms, pas) {
    const p = pas || 16;
    let ramas = ms === undefined ? 16 : ms;
    do {
      const d = Math.min(p, ramas) || p;
      ceas.t += d;
      j.cadru(ceas.t);
      ramas -= d;
    } while (ramas > 0);
  };

  // Un singur cadru, cu pânza golită înainte: întoarce doar ce s-a desenat acum.
  j.cadruCurat = function () {
    panza.goleste();
    ceas.t += 16;
    j.cadru(ceas.t);
    return panza.desene.slice();
  };

  // Ce desenează o singură funcție, fără restul scenei.
  j.doar = function (f) {
    panza.goleste();
    f();
    return panza.desene.slice();
  };

  j.atinge = function (x, y) {
    const lista = ascultatori["pointerdown"] || [];
    for (const f of lista) f({ clientX: x, clientY: y });
  };

  /* Redimensionarea din teste: schimbăm fereastra falsă și chemăm funcția
     scenei. Numele se bat cap în cap — de-aia o punem deoparte întâi. */
  const redimScena = j.redimensioneaza;
  j.redimensioneaza = function (l, i) {
    fereastra.innerWidth = l; fereastra.innerHeight = i;
    redimScena();
  };

  return j;
}

/* Deschiderea are trei pagini, iar atingerea le întoarce. Jocul pornește abia
   de pe ultima — testele care vor să ajungă în joc trec întâi prin ele. */
function incepeJocul(j, x, y) {
  for (let k = 0; k < 5 && j.stare() === "intuneric"; k++) {
    j.atinge(x, y);
    j.avanseaza(120);
  }
}

function culorileDin(desene) {
  const set = new Set();
  for (const d of desene) {
    if (typeof d.stil === "string") set.add(d.stil.toLowerCase());
    else if (d.stil && d.stil.gradient) for (const c of d.stil.gradient) set.add(String(c).toLowerCase());
  }
  return set;
}

function areCuloarea(desene, culoare) {
  return culorileDin(desene).has(String(culoare).toLowerCase());
}

function formeCu(desene, culoare) {
  const c = String(culoare).toLowerCase();
  return desene.filter(function (d) {
    if (typeof d.stil === "string") return d.stil.toLowerCase() === c;
    if (d.stil && d.stil.gradient) return d.stil.gradient.some(function (g) { return String(g).toLowerCase() === c; });
    return false;
  });
}

function textele(desene) {
  return desene.filter(function (d) { return d.op === "text"; }).map(function (d) { return d.text; });
}

function totTextul(desene) { return textele(desene).join(" "); }

/* Scrisul de pe un cadru, **cu tot cu cel adus de pe stampile**. Textele care
   nu se schimba niciodata se scriu o data pe o panza ascunsa si pe urma se
   copiaza, ca sa nu se masoare fiecare cuvant de saizeci de ori pe secunda. Pe
   ecran arata la fel; pentru un test care se uita numai la operatiile de scris,
   dispar cu totul. */
function totScrisul(desene) {
  let tot = totTextul(desene);
  for (const d of desene) {
    if (d.op !== "imagine" || !d.sursa || !d.sursa._panza) continue;
    tot += " " + totTextul(d.sursa._panza.desene);
  }
  return tot;
}

/* Unde a cazut pe ecran stampila care poarta textul cautat. */
function undeEScrisul(desene, tipar) {
  for (const d of desene) {
    if (d.op === "text" && tipar.test(d.text) && d.limite) return d.limite;
    if (d.op !== "imagine" || !d.sursa || !d.sursa._panza) continue;
    if (tipar.test(totTextul(d.sursa._panza.desene))) return d.limite;
  }
  return null;
}

// Cea mai lungă cale desenată — folosit ca „are curbe, nu e un dreptunghi sec".
function celMaiLungTraseu(desene) {
  let max = 0;
  for (const d of desene) if (d.puncte && d.puncte.length > max) max = d.puncte.length;
  return max;
}

function seSuprapun(a, b) {
  return !(a.x1 <= b.x0 || b.x1 <= a.x0 || a.y1 <= b.y0 || b.y1 <= a.y0);
}

// Toate cercurile/elipsele desenate, în coordonatele scenei.
function cercurileDin(desene, culoare) {
  const out = [];
  for (const d of desene) {
    if (culoare !== undefined) {
      const c = String(culoare).toLowerCase();
      const potrivit = typeof d.stil === "string" ? d.stil.toLowerCase() === c
        : (d.stil && d.stil.gradient ? d.stil.gradient.some(function (g) { return String(g).toLowerCase() === c; }) : false);
      if (!potrivit) continue;
    }
    for (const c of d.cercuri || []) out.push(c);
  }
  return out;
}

function existaCercLanga(cercuri, x, y, toleranta) {
  return cercuri.some(function (c) { return Math.hypot(c.x - x, c.y - y) <= toleranta; });
}

// „Colorat" înseamnă că roșul, verdele și albastrul nu sunt aproape egale.
function viuColorat(c) {
  const m = String(c).match(/^#([0-9a-f]{6})$/i);
  if (!m) return false;
  const n = parseInt(m[1], 16);
  const r = (n >> 16) & 255, v = (n >> 8) & 255, a = n & 255;
  return Math.max(r, v, a) - Math.min(r, v, a) > 25;
}

       fata ramane dreapta si se ingusteaza spre balama. */
    const j = porneste({ latime: 1400, inaltime: 800 });
    inCampie(j);
    const K = j.geomCasa(1400, 800);
    function latimeaCanaturilor(deschidere) {
      j.goleste();

      /* Masor tablia de sus a canatului, nu tot canatul: golul usii si lumina
         dinauntru sunt si ele inalte cat usa, si mi-ar da mereu aceeasi latime. */
      let lat = 0;
      for (const f of j.desene) {
        if (!f.limite) continue;

        if (h > K.usaH * 0.28 && h < K.usaH * 0.42) lat = Math.max(lat, f.limite.x1 - f.limite.x0);
      }
      return lat;

    const deschisa = latimeaCanaturilor(1);
    adevarat(inchisa > K.usaW * 0.3, "canatul inchis nu se vede deloc: " + inchisa);
    adevarat(deschisa < inchisa * 0.6,

      "nu suntem pe prima pagină");

    egal(j.stare(), "intuneric", "atingerea de pe prima pagină a pornit jocul");
    j.avanseaza(1400);
    adevarat(/nu are scop/i.test(totTextul(j.cadruCurat())),
      "atingerea n-a întors pagina spre a doua");
    j.atinge(700, 400);
    j.avanseaza(1400);
    adevarat(/Atinge ecranul oriunde/i.test(totTextul(j.cadruCurat())),
      "a doua atingere n-a dus la pagina cu mânuța");
  });

  test("pe ultima pagină, atingerea sparge balonul; jocul vine după pocnet", function () {
    /* Ochiul trebuie să apuce să vadă ce a făcut mâna lui. Dacă punctul se
       naște în aceeași clipă în care atingi, cele două se calcă una pe alta și
       nu se înțelege că una a produs-o pe cealaltă. */
    const j = porneste({ latime: 1400, inaltime: 800 });
    j.avanseaza(2200);
    j.atinge(700, 400);                      // pagina a doua
    j.atinge(700, 400);                      // pagina a treia
    j.avanseaza(1400);
    j.atinge(700, 400);                      // pocnet
    egal(j.stare(), "intuneric", "jocul a pornit în aceeași clipă cu pocnetul");
    j.avanseaza(120);
    adevarat(j.catAPocnit(j.ceas.t) > 0, "balonul nu s-a spart la atingere");
    egal(j.stare(), "intuneric", "jocul a pornit înainte să se risipească cioburile");
    j.avanseaza(800);                        // se risipesc cioburile
    adevarat(j.stare() !== "intuneric",
      "după ce s-au risipit cioburile, jocul tot n-a pornit");
  });

  test("din balonul spart nu rămâne nimic pe ecran", function () {
    /* Sclipirea de pe degetul mijlociu își punea singură opacitatea, peste
       stingerea din jur: foița se ducea, iar pe ecran rămânea un oval alb. */
    const j = porneste({ latime: 1400, inaltime: 800 });
    j.avanseaza(2200);
    j.atinge(700, 400); j.atinge(700, 400);
    j.avanseaza(1400);
    j.atinge(700, 400);
    j.avanseaza(520);                       // foița e stinsă de mult
    const d = j.cadruCurat();
    // nimic din mănușă nu mai are voie să fie desenat plin
    const pline = d.filter(function (x) {
      return x.alfa !== undefined && x.alfa > 0.6 &&
             typeof x.stil === "string" && /ffffff|fff\b/i.test(x.stil);
    });
    egal(pline.length, 0,
      "au rămas " + pline.length + " forme albe pline din mănușa spartă");
  });

  test("balonul spart lasă cioburi, nu dispare pur și simplu", function () {
    const j = porneste({ latime: 1400, inaltime: 800 });
    j.avanseaza(2200);
    j.atinge(700, 400); j.atinge(700, 400);
    j.avanseaza(1400);
    j.goleste();
    j.atinge(700, 400);
    j.avanseaza(200);
    const d = j.cadruCurat();
    const albe = formeCu(d, "rgba(224, 238, 255, 0.75)");
    adevarat(albe.length >= 4,
      "s-au văzut doar " + albe.length + " cioburi din balonul spart");
  });

  test("paginile se întorc în ordine: întâi titlul, la urmă îndemnul", function () {
    /* Ecranul negru nu poate spune trei lucruri deodată. Ordinea contează: cine
       intră vede întâi ce e lucrul, pe urmă ce fel de lucru e, abia la sfârșit
       ce are de făcut. */
    const j = porneste();
    const titlul = paginaLa(j, j.PAGINI_INVITATIE[0].de + 1400).text;
    const indemnul = paginaLa(j, j.PAGINI_INVITATIE[2].de + 1400).text;
    adevarat(/VIAȚA DINTR-O ATINGERE/i.test(titlul.replace(/\s+/g, ' ')),
      "prima pagină n-are titlul");
    adevarat(/Atinge ecranul/i.test(indemnul), "ultima pagină n-are îndemnul");
    adevarat(j.PAGINI_INVITATIE[0].pana <= j.PAGINI_INVITATIE[2].de,
      "titlul se vede încă în clipa în care apare îndemnul");
  });

  test("invitația dispare imediat ce jucăria a pornit", function () {
    const j = porneste();
    j.avanseaza(3500);
    j.atinge(600, 400);
    const d = j.cadruCurat();
    adevarat(!/Viața dintr-o atingere/.test(totTextul(d)),
      "titlul a rămas pe ecran după prima atingere");
  });

  test("mingea crește vizibil față de balonul din care s-a născut", function () {
    const j = porneste();
    j.avanseaza(3500);
    incepeJocul(j, 600, 400);        // trec paginile, se naște punctul
    j.avanseaza(5000);               // crește și devine balon
    for (let i = 0; i < 6; i++) { j.atinge(j.balon.x, j.balon.y); j.avanseaza(200); }
    adevarat(j.stare() === "transformare" || j.stare() === "minge",
      "balonul nu a fost prins (a rămas în „" + j.stare() + "”)");
    const razaBalon = j.balon.razaBaza;
    j.avanseaza(j.DURATA_TRANSFORMARII + 500);
    adevarat(j.minge.raza > razaBalon * 1.25,
      "mingea (" + Math.round(j.minge.raza) + ") nu e mai mare decât balonul (" +
      Math.round(razaBalon) + ")");
  });

  test("drumul întreg: din întuneric până în muzeu, numai din atingeri", function () {
    const j = porneste();
    j.avanseaza(3500);
    incepeJocul(j, 600, 400);                 // trec paginile, se naște punctul
    j.avanseaza(5000);                        // crește și devine balon
    for (let i = 0; i < 8 && j.stare() === "balon"; i++) {
      j.atinge(j.balon.x, j.balon.y);
      j.avanseaza(200);
    }
    j.avanseaza(j.DURATA_TRANSFORMARII + 500);
    egal(j.stare(), "minge", "nu s-a ajuns la minge");

    // mingea mânjește pământul până elefantul se hotărăște să vină la curățenie
    for (let i = 0; i < 20; i++) {
      j.adaugaPata(j.W() * (0.2 + i * 0.03), j.H() * 0.85, 14);
    }
    let scurs = 0;
    while (!(j.minge.inBuzunar && j.elefant.stare === "plimbare") && scurs < 60000) {
      j.avanseaza(160); scurs += 160;
    }
    adevarat(j.minge.inBuzunar, "elefantul nu a strâns mingea în " + (scurs / 1000) + "s");
    egal(j.pete.length, 0, "au rămas pete neaspirate");
    adevarat(j.gradina.length > 0, "curățenia nu a lăsat nicio plantă în urmă");

    j.atinge(j.elefant.x, j.picioareElefant() - 20);   // atingerea care deschide muzeul
    egal(j.stare(), "muzeu", "atingerea elefantului nu a deschis muzeul");
  });

  test("manualul chiar spune ceva despre atelier", function () {
    const j = porneste();
    j.mergiLaStarea("muzeu");
    j.intrareScena3(j.ceas.t);
    j.faza3("manual");
    j.s3.manualPagina = 1; j.s3.articol = 0;
    j.avanseaza(3000);                      // atât îi ia custodelui să-l deschidă
    const d = j.cadruCurat();
    const text = totTextul(d);
    adevarat(/Art\. \d+/.test(text), "manualul nu arată niciun articol: " + text);
    adevarat(j.ARTICOLE_MANUAL.length >= 8, "prea puține articole");
  });

  test("butonul soneriei nu are text scris pe el", function () {
    const j = porneste();
    j.mergiLaStarea("muzeu");
    j.intrareScena3(j.ceas.t);
    j.faza3("nuMaApasa");
    j.s3.bilet = null;
    const d = j.cadruCurat();
    adevarat(!/\bNU\b|\bDA\b/.test(totTextul(d)),
      "butonul are etichetă: " + totTextul(d));
  });

  test("muzeul deschis arată un singur buzunar, cu numele lui", function () {
    const j = porneste();
    j.mergiLaStarea("muzeu");
    j.intrareScena3(j.ceas.t);
    j.faza3("usaDeschisa");
    j.s3.usa = 1; j.s3.bilet = null;
    const d = j.cadruCurat();
    adevarat(/GALERIE/.test(totTextul(d)), "pe buzunar nu scrie nimic");
    const numere = textele(d).filter(function (t) { return /^[1-9]$/.test(t); });
    egal(numere.length, 0, "au rămas firide numerotate: " + JSON.stringify(numere));
  });
}
